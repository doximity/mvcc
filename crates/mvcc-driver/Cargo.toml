[package]
name = "mvcc-driver"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "mvcc: an nvcc-compatible driver that compiles CUDA C++ to Metal"

[[bin]]
name = "mvcc"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
